<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chilli Beans (New Money) — Guia de Investimento · Akron/Lorinvest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F7; --card:#FFFFFF; --ink:#1A1A1A; --muted:#6A6A6E;
  --accent:#2B2B2E; --accent2:#55565A; --accent3:#E4002B;
  --red:#E4002B; --neg:#B3261E; --green:#2E7D4F; --amber:#B8860B;
  --line:#E6E6E9; --chip:#F0F0F2; --graf:#3A3A3E;
  --shadow:0 1px 2px rgba(26,26,26,.05),0 4px 14px rgba(26,26,26,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1,'lnum' 1}
button{font-family:inherit;cursor:pointer}
svg text{font-feature-settings:'tnum' 1,'lnum' 1}
b,strong{font-weight:700}

/* ---------- header (compacto, uma linha — como o Compass) ---------- */
header{position:sticky;top:0;z-index:50;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(26,26,26,.05)}
header::before{content:'';display:block;height:3px;background:linear-gradient(90deg,#1A1A1A,#1A1A1A 55%,var(--red))}
.hwrap{max-width:1680px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:13px}
#navToggle{background:#fff;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:700;color:var(--accent);padding:3px 10px;cursor:pointer;line-height:1.2;flex:none}
#navToggle:hover{background:#F2F2F4;border-color:var(--accent2)}
.logo{display:flex;align-items:center;gap:10px;flex:none}
.logo .brand{background:#1A1A1A;border-radius:9px;padding:8px 13px;display:flex;align-items:center}
.logo .brand img{height:18px;width:auto;display:block}
.hsep{width:1px;height:26px;background:var(--line);flex:none}
.htit .t{font-size:13.5px;font-weight:700;letter-spacing:-.1px;line-height:1.15}
.htit .s{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.hspace{flex:1}
.hconf{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#fff;background:var(--red);padding:5px 11px;border-radius:6px;flex:none}
.mob-tab{display:none}

/* ---------- layout + sidebar (único navegador) ---------- */
.layout{display:flex;max-width:1680px;margin:0 auto;align-items:flex-start}
.maincol{flex:1;min-width:0}
#sidebar{width:222px;flex:none;position:sticky;top:var(--hh,58px);align-self:flex-start;max-height:calc(100vh - var(--hh,58px));overflow-y:auto;padding:10px 8px 26px;border-right:1px solid var(--line);transition:width .18s ease,padding .18s ease}
body.snav-collapsed #sidebar{width:0;padding:0;overflow:hidden;border-right:none}
#navlist .grp{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 10px 5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#navlist .grp i{width:7px;height:7px;border-radius:2px;flex:none}
#navlist button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;border-left:2.5px solid transparent;font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 11px;border-radius:0 7px 7px 0;white-space:nowrap;cursor:pointer;transition:background .12s,color .12s}
#navlist .nav-ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#navlist button:hover{color:var(--accent);background:#F0F0F2}
#navlist button.on{color:var(--ink);border-left-color:var(--accent3);background:#F4EAEC}
@media(max-width:860px){
  #sidebar{position:fixed;left:0;top:var(--hh,58px);z-index:60;background:#fff;box-shadow:3px 0 16px rgba(26,26,26,.14);height:calc(100vh - var(--hh,58px));max-height:none}
  .htit{display:none}
  .mob-tab{display:block;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:700;color:var(--ink)}
}

/* ---------- main + cards ---------- */
main{margin:0;padding:20px 22px 60px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px 19px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:14.5px;font-weight:700;margin-bottom:3px;letter-spacing:-.1px}
.card .cap{font-size:12.5px;line-height:1.5;color:#5A5A5E;margin-bottom:12px}
.card .lead{font-size:14px;line-height:1.62;color:var(--ink);margin:2px 0 14px}
.card.tinted{background:#FAFAFB}
.card.dark{background:#1A1A1A;border-color:#1A1A1A;color:#fff}
.card.dark h2{color:#fff}.card.dark .cap{color:rgba(255,255,255,.66)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row31{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:820px){.row2,.row3,.row31{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto}

/* KPIs — conteúdo do painel Sumário (não fixos no topo) */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px 13px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:112px;min-width:0}
.kpi .lbl{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-size:22px;font-weight:800;margin-top:8px;letter-spacing:-.6px;line-height:1.1;white-space:nowrap}
.kpi .sub{margin-top:auto;font-size:10.5px;color:var(--muted);padding-top:6px}
.kpi.k-feat{background:#1A1A1A;border-color:#1A1A1A}
.kpi.k-feat .lbl{color:rgba(255,255,255,.6)}.kpi.k-feat .val{color:#fff}.kpi.k-feat .sub{color:rgba(255,255,255,.72)}
.kpi.k-feat .val .u{color:var(--red)}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* section head (ícone-badge, padrão Compass — não é barra) */
.section-head{display:flex;align-items:flex-start;gap:11px;margin:2px 0 12px}
.section-head .title-icon{flex:none;width:30px;height:30px;border-radius:9px;background:#F0F0F2;color:var(--accent);display:flex;align-items:center;justify-content:center;margin-top:1px}
.section-head .title-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.section-head .head-copy{flex:1;min-width:0}
.section-head h2{font-size:15px;font-weight:700;margin-bottom:2px}
.section-head .cap{font-size:12.5px;color:#5A5A5E;line-height:1.45}
.section-head .tag{flex:none;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--chip);padding:4px 10px;border-radius:20px;align-self:center}

/* subtabs */
.subtabs{display:inline-flex;gap:4px;background:#EEEEF0;border:1px solid var(--line);border-radius:10px;padding:4px;margin:0 2px 16px;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:none;background:none;font-size:12.5px;font-weight:700;color:var(--muted);padding:7px 15px;border-radius:7px;cursor:pointer;transition:background .12s,color .12s;flex:0 0 auto;white-space:nowrap}
.subtabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.subpane{display:none}.subpane.on{display:block}

/* kv / stat tiles (sem barras) */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px}
.kv .k{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kv .v{font-size:13.5px;font-weight:600;margin-top:2px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.stat4 .st{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#FBFBFC}
.stat4 .st .n{font-size:22px;font-weight:800;letter-spacing:-.5px}
.stat4 .st .c{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
@media(max-width:820px){.stat4{grid-template-columns:repeat(2,1fr)}}

/* steps / blocks (sem barra colorida) */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.steps.s3{grid-template-columns:repeat(3,1fr)}
.steps.s5{grid-template-columns:repeat(5,1fr)}
.step{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#FBFBFC}
.step .n{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.step b{display:block;font-size:13px;margin:5px 0 3px}
.step p{font-size:11.6px;color:#50505A;line-height:1.5}
@media(max-width:900px){.steps,.steps.s5{grid-template-columns:repeat(2,1fr)}.steps.s3{grid-template-columns:1fr}}

/* tables */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
td{font-size:12.5px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:#FAFAFB}
tr.tot td{font-weight:700;border-top:2px solid var(--accent2);background:#F5F5F6}
td.neg{color:var(--neg)}
.opt table td.l{font-weight:600}
.opt thead th{text-align:center;color:var(--ink);font-size:11px}
.opt thead th.hl{color:var(--red)}
.opt td{text-align:center;vertical-align:top;white-space:normal;min-width:150px}
.opt td.l{white-space:nowrap;min-width:auto}
.opt .colB{background:#FAF3F4}

/* pills / notes (sem barra lateral — fundo tintado + rótulo inline) */
.pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block}
.pill.red{background:#F4EAEC;color:var(--red)}
.pill.grn{background:#E7F0EA;color:var(--green)}
.pill.gry{background:var(--chip);color:var(--muted)}
.pill.amb{background:#F7EFD9;color:var(--amber)}
.note{background:#FAFAFB;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:12px;color:#44444A;margin-top:12px;line-height:1.55}
.note .nl{font-weight:700;color:var(--red);margin-right:4px}
.note.warn{background:#FBF8F0;border-color:#EFE4C7}
.note.warn .nl{color:var(--amber)}

/* rationale blocks (sem barra no topo) */
.rat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rat .r{border:1px solid var(--line);border-radius:11px;padding:14px 15px;background:#FBFBFC}
.rat .r .t{font-size:12.5px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.rat .r .t::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
.rat .r p{font-size:11.6px;color:#50505A;line-height:1.5}
@media(max-width:900px){.rat{grid-template-columns:repeat(2,1fr)}}

/* risks (sem barra lateral — usa pill de severidade) */
.risks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.risk{border:1px solid var(--line);border-radius:11px;padding:12px 14px 13px;background:var(--card);box-shadow:var(--shadow)}
.risk .rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.risk .rt{font-size:12.5px;font-weight:700;line-height:1.25}
.risk .rb{flex-shrink:0;font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.risk .rd{font-size:11.5px;color:var(--muted);line-height:1.42}

/* timeline vertical (é linha do tempo, não card) */
.tml{position:relative;margin:6px 0 2px;padding-left:26px}
.tml::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tml .ev{position:relative;padding:0 0 16px 4px}
.tml .ev::before{content:'';position:absolute;left:-23px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--accent2)}
.tml .ev.hot::before{border-color:var(--red);background:var(--red)}
.tml .ev .yr{font-size:11px;font-weight:700;color:var(--red)}
.tml .ev .tt{font-size:12.8px;font-weight:600;margin:1px 0 1px}
.tml .ev .dd{font-size:11.5px;color:var(--muted);line-height:1.45}

/* horizontal chrono */
.chrono{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.chrono .c{border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:#FBFBFC}
.chrono .c .dt{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.05em}
.chrono .c .h{font-size:12.5px;font-weight:700;margin:4px 0 2px}
.chrono .c p{font-size:11px;color:#50505A;line-height:1.45}
@media(max-width:900px){.chrono{grid-template-columns:1fr 1fr}}

/* cascade (chip numerado, sem barra) */
.casc{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.casc .lv{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#fff}
.casc .lv .rk{width:26px;height:26px;flex:none;border-radius:7px;background:#55565A;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.casc .lv.p1{background:#FAFAFB}.casc .lv.p1 .rk{background:var(--red)}
.casc .lv .nm{font-weight:700;font-size:13px}
.casc .lv .ds{font-size:11px;color:var(--muted)}
.casc .arrow{text-align:center;color:var(--muted);font-size:13px;line-height:.5}

/* flow diagram */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .fn{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#FBFBFC;text-align:center}
.flow .fn .ft{font-size:12px;font-weight:700}
.flow .fn .fs{font-size:10.5px;color:var(--muted);margin-top:2px}
.flow .fa{display:flex;align-items:center;justify-content:center;padding:0 6px;color:var(--red);font-weight:800;font-size:17px}
@media(max-width:820px){.flow{flex-direction:column}.flow .fa{transform:rotate(90deg);padding:4px 0}}

/* hero band */
.hero{background:linear-gradient(120deg,#1A1A1A,#2B2B2E);border-radius:14px;padding:20px 22px;color:#fff;margin-bottom:14px}
.hero .hl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.hero .ht{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:6px 0 3px}
.hero .hd{font-size:12.5px;color:rgba(255,255,255,.72);line-height:1.5;max-width:640px}
.hero .hstats{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px}
.hero .hstats .hs .n{font-size:22px;font-weight:800;letter-spacing:-.5px}
.hero .hstats .hs .n .u{color:var(--red);font-size:14px}
.hero .hstats .hs .c{font-size:10px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
@media(max-width:640px){.hero .hstats{gap:16px}.hero .hstats .hs .n{font-size:18px}}

/* horizontal timeline */
.tlwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:4px}
.tline{display:flex;gap:14px;min-width:640px;padding-top:20px}
.tnode{flex:1 1 0;position:relative;min-width:118px}
.tnode::before{content:'';position:absolute;top:-14px;left:5px;width:11px;height:11px;border-radius:50%;background:var(--dc,#8A8A8E);border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--line);z-index:1}
.tnode::after{content:'';position:absolute;top:-9px;left:16px;right:-14px;height:2px;background:var(--line)}
.tnode:last-child::after{display:none}
.tnode .ty{font-size:11px;font-weight:800;color:var(--dc,#3A3A3E);margin-bottom:5px}
.tnode .tt{font-size:11.3px;line-height:1.42;color:#3A3A3E}

/* org chart */
.org{display:flex;flex-direction:column;align-items:center}
.org .lvl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.org .obox{border:1px solid var(--line);border-radius:10px;padding:9px 14px;background:#fff;text-align:center;min-width:118px;box-shadow:var(--shadow)}
.org .obox .on{font-size:12.5px;font-weight:700;line-height:1.2}
.org .obox .os{font-size:9.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.org .obox.dark{background:#1A1A1A;border-color:#1A1A1A}.org .obox.dark .on{color:#fff}.org .obox.dark .os{color:rgba(255,255,255,.6)}
.org .obox.hl{border-color:var(--red);background:#FAF3F4}.org .obox.hl .on{color:var(--red)}
.org .obox.av{border-color:var(--accent2);border-style:dashed}
.org .conn{width:2px;height:16px;background:var(--line)}
.org .osub{width:100%;max-width:780px;border:1px solid var(--line);border-radius:12px;background:#FBFBFC;padding:12px 12px 6px}
.org .osub-t{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;text-align:center}
.org .osub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:8px}
.org .osub-grid .obox{min-width:0;box-shadow:none}

/* markup cascade */
.cascade-m{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.cascade-m .cm{flex:1;min-width:130px;border:1px solid var(--line);border-radius:11px;padding:13px 14px;background:#FBFBFC;text-align:center}
.cascade-m .cm .cmt{font-size:12.5px;font-weight:700}
.cascade-m .cm .cmv{font-size:19px;font-weight:800;color:var(--red);margin:4px 0;letter-spacing:-.4px}
.cascade-m .cm .cms{font-size:10.5px;color:var(--muted);line-height:1.4}
.cascade-m .cmar{display:flex;align-items:center;justify-content:center;padding:0 8px;color:var(--muted);font-weight:800;font-size:18px}
@media(max-width:820px){.cascade-m{flex-direction:column}.cascade-m .cmar{transform:rotate(90deg);padding:4px 0}}

/* cash cycle bar */
.cycle{position:relative;height:78px;margin:22px 0 8px}
.cycle .track{position:absolute;left:0;right:0;top:30px;height:14px;background:#EDEDF0;border-radius:7px}
.cycle .fill{position:absolute;top:30px;height:14px;background:#1A1A1A;border-radius:7px}
.cycle .gap{position:absolute;top:28px;height:18px;background:rgba(228,0,43,.16);border:1px solid var(--red);border-radius:6px}
.cycle .mk{position:absolute;top:30px;width:2px;height:14px;background:#fff}
.cycle .lb{position:absolute;top:48px;font-size:9.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.cycle .lb b{color:var(--ink);display:block;font-size:10px}
.cycle .gaplb{position:absolute;top:6px;font-size:10px;font-weight:700;color:var(--red);transform:translateX(-50%);white-space:nowrap}

/* format cards */
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fmt{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:#fff;box-shadow:var(--shadow)}
.fmt .fh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fmt .fic{width:26px;height:26px;border-radius:7px;background:#F4EAEC;color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.fmt .fic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.fmt .fn{font-size:13px;font-weight:700}
.fmt .fv{font-size:17px;font-weight:800;letter-spacing:-.3px}
.fmt .frow{display:flex;justify-content:space-between;font-size:11px;border-top:1px solid var(--line);padding-top:7px;margin-top:8px}
.fmt .frow .k{color:var(--muted)}
@media(max-width:820px){.fmts{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.fmts{grid-template-columns:1fr}}

/* option comparison cards */
.optcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.optcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.optcard.sel{border-color:var(--red);background:#FDF6F7;box-shadow:var(--shadow)}
.optcard-h{padding:12px 14px;border-bottom:1px solid var(--line)}
.optcard.sel .optcard-h{background:#FAF3F4}
.oc-t{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oc-s{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.oc-row{padding:9px 14px;border-bottom:1px solid var(--line)}
.oc-row:last-child{border:none}
.oc-k{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.oc-v{font-size:11.3px;line-height:1.4;color:var(--ink)}
@media(max-width:820px){.optcards{grid-template-columns:1fr}}

/* control / segmented bar */
.ctrlbar{position:relative;height:32px;border-radius:8px;overflow:hidden;background:#EDEDF0;display:flex;margin:12px 0 6px}
.ctrlbar .seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.ctrlbar .thr{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);z-index:2}
.ctrlbar .thrl{position:absolute;top:-16px;font-size:9.5px;font-weight:700;color:var(--ink);transform:translateX(-50%);white-space:nowrap}

/* term sheet */
.ts-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:#1A1A1A;border-radius:11px;margin-bottom:12px}
.ts-head .tv{font-size:18px;font-weight:800;color:#fff}
.ts-head .tl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.6)}
.tsrow{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:8px 2px}
.tsrow .k{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);align-self:center;flex:none;max-width:42%}
.tsrow .v{font-size:12.5px;font-weight:600;text-align:right}

/* news feed timeline */
.newsfeed{position:relative;padding-left:20px;margin-top:10px}
.newsfeed::before{content:'';position:absolute;left:6px;top:6px;bottom:10px;width:2px;background:var(--line)}
.nf{position:relative;padding:0 0 15px 10px}
.nf-dot{position:absolute;left:-15px;top:4px;width:11px;height:11px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.nf-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.nf-dt{font-weight:700;color:var(--ink);font-size:11px}
.nf-src{color:var(--muted);font-size:11px}
.nf-h{font-weight:700;font-size:13px;line-height:1.35;margin-bottom:2px}
.nf-p{font-size:11.8px;color:#50505A;line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:10px}
.legend span{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-weight:500}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;font-style:normal}
.src{font-size:10.5px;color:var(--muted);margin-top:9px;font-style:italic}
.axt{font-size:11px;fill:var(--muted)}
.axl{stroke:var(--line);stroke-width:1}
.stub{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;background:#FBFBFC}
.stub b{color:var(--accent);font-weight:700}
#tip{position:fixed;z-index:99;pointer-events:none;background:#1A1A1A;color:#fff;font-size:11px;padding:7px 10px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:300px;white-space:pre-line;line-height:1.5}
</style>

const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function tip(e,txt){const t=$("#tip");t.textContent=txt;t.style.display="block";const m=ev=>{t.style.left=(ev.clientX+14)+"px";t.style.top=(ev.clientY+14)+"px";};m(e);e.target.__m=m;e.target.addEventListener("mousemove",m);}
function untip(e){const t=$("#tip");t.style.display="none";if(e.target.__m)e.target.removeEventListener("mousemove",e.target.__m);}
const money=v=>v.toLocaleString("pt-BR",{maximumFractionDigits:1});

function svgHBars(items,{fmt=money}={}){
  const max=Math.max(...items.map(d=>d.v))*1.05||1;
  let s=`<div style="display:flex;flex-direction:column;gap:9px">`;
  items.forEach(d=>{const w=(d.v/max*100).toFixed(1);
    s+=`<div style="display:flex;align-items:center;gap:10px">
      <div style="width:112px;flex:none;font-size:12px;font-weight:600;text-align:right">${d.k}</div>
      <div style="flex:1;background:#F0F0F2;border-radius:6px;height:22px"><div style="width:${w}%;height:100%;background:${d.c};border-radius:6px"></div></div>
      <div style="width:70px;flex:none;font-size:12.5px;font-weight:700">${fmt(d.v)}</div></div>`;});
  return s+`</div>`;
}
function bindTips(root){$$("[data-t]",root).forEach(n=>{n.addEventListener("mouseenter",e=>tip(e,n.getAttribute("data-t")));n.addEventListener("mouseleave",untip);n.style.cursor="default";});}

/* vertical bars: data=[{k,v}] */
function svgBars(data,{h=210,unit="",color="var(--ink)",fmt=money}={}){
  const W=560,top=16,bottom=28,left=6,right=6;
  const max=Math.max(...data.map(d=>d.v))*1.15||1, iw=W-left-right, bw=iw/data.length;
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img">`;
  for(let g=0;g<=3;g++){const y=top+(h-top-bottom)*g/3;s+=`<line class="axl" x1="${left}" y1="${y.toFixed(1)}" x2="${W-right}" y2="${y.toFixed(1)}"/>`;}
  data.forEach((d,i)=>{const bh=(d.v/max)*(h-top-bottom),x=left+i*bw+bw*0.2,w=bw*0.6,y=h-bottom-bh;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${d.c||color}" data-t="${d.k}: ${fmt(d.v)}${unit}"/>`;
    s+=`<text class="axt" x="${(x+w/2).toFixed(1)}" y="${h-bottom+13}" text-anchor="middle">${d.k}</text>`;
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">${fmt(d.v)}</text>`;});
  return s+`</svg>`;
}
/* stacked bars: years[], series=[{k,color,data[]}] */
function svgStacked(years,series,{h=230,totals=null}={}){
  const W=560,top=18,bottom=28,left=6,right=6;
  const sums=years.map((_,i)=>series.reduce((a,s)=>a+s.data[i],0));
  const max=Math.max(...sums)*1.14||1, iw=W-left-right, bw=iw/years.length;
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img">`;
  for(let g=0;g<=3;g++){const y=top+(h-top-bottom)*g/3;s+=`<line class="axl" x1="${left}" y1="${y.toFixed(1)}" x2="${W-right}" y2="${y.toFixed(1)}"/>`;}
  years.forEach((yr,i)=>{let acc=0;const x=left+i*bw+bw*0.2,w=bw*0.6;
    series.forEach(se=>{const bh=(se.data[i]/max)*(h-top-bottom),y=h-bottom-acc-bh;
      s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" fill="${se.color}" data-t="${yr} · ${se.k}: ${money(se.data[i])}"/>`;acc+=bh;});
    const tv=totals?totals[i]:sums[i];
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${(h-bottom-acc-5).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">${money(tv)}</text>`;
    s+=`<text class="axt" x="${(x+w/2).toFixed(1)}" y="${h-bottom+13}" text-anchor="middle">${yr}</text>`;});
  return s+`</svg>`;
}
/* line: years[], series=[{k,color,data[]}] with optional projFrom index */
function svgLine(years,series,{h=210,fmt=money,projFrom=null}={}){
  const W=560,top=16,bottom=26,left=30,right=10;
  const all=series.flatMap(s=>s.data), max=Math.max(...all)*1.12||1, min=Math.min(0,...all);
  const iw=W-left-right, ih=h-top-bottom, xx=i=>left+iw*i/(years.length-1), yy=v=>top+ih*(1-(v-min)/(max-min));
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img">`;
  for(let g=0;g<=3;g++){const val=min+(max-min)*(1-g/3),y=top+ih*g/3;s+=`<line class="axl" x1="${left}" y1="${y.toFixed(1)}" x2="${W-right}" y2="${y.toFixed(1)}"/><text class="axt" x="0" y="${(y-2).toFixed(1)}">${fmt(val)}</text>`;}
  if(projFrom!=null){const px=xx(projFrom);s+=`<rect x="${px.toFixed(1)}" y="${top}" width="${(W-right-px).toFixed(1)}" height="${ih}" fill="#F0F0F2" opacity=".5"/>`;}
  years.forEach((yr,i)=>s+=`<text class="axt" x="${xx(i).toFixed(1)}" y="${h-8}" text-anchor="middle">${yr}</text>`);
  series.forEach(se=>{const pts=se.data.map((v,i)=>`${xx(i).toFixed(1)},${yy(v).toFixed(1)}`).join(" ");
    s+=`<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="2.4" stroke-linejoin="round"/>`;
    se.data.forEach((v,i)=>s+=`<circle cx="${xx(i).toFixed(1)}" cy="${yy(v).toFixed(1)}" r="3" fill="${se.color}" data-t="${yr2(years,i)} · ${se.k}: ${fmt(v)}"/>`);});
  return s+`</svg>`;
}
function yr2(years,i){return years[i];}

/* donut: slices=[{k,v,c}] */
function svgDonut(slices,{size=150,thick=26,center=""}={}){
  const tot=slices.reduce((a,s)=>a+s.v,0)||1, r=(size-thick)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  let off=0,seg="";
  slices.forEach(s=>{const frac=s.v/tot,len=frac*C;
    seg+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${thick}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" data-t="${s.k}: ${Math.round(frac*100)}%"/>`;off+=len;});
  const leg=slices.map(s=>`<span><i style="background:${s.c}"></i>${s.k} · ${Math.round(s.v/tot*100)}%</span>`).join("");
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><svg viewBox="0 0 ${size} ${size}" style="width:${size}px;max-width:40%;flex:none">${seg}${center?`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${center}</text>`:""}</svg><div class="legend" style="margin:0;flex-direction:column;gap:7px">${leg}</div></div>`;
}
/* horizontal comparison bars: rows=[{k,v,c?,hl?,lab?}] */
function svgHCompare(rows,{fmt=(v)=>money(v),unit=""}={}){
  const max=Math.max(...rows.map(d=>d.v))*1.02||1;
  return `<div style="display:flex;flex-direction:column;gap:8px">`+rows.map(d=>{
    const w=(d.v/max*100).toFixed(1);const col=d.hl?'var(--red)':(d.c||'var(--ink)');
    return `<div style="display:flex;align-items:center;gap:10px"><div style="width:150px;flex:none;font-size:11.5px;font-weight:${d.hl?'700':'600'};text-align:right;color:${d.hl?'var(--red)':'var(--ink)'}">${d.k}</div><div style="flex:1;background:#F0F0F2;border-radius:6px;height:20px"><div style="width:${w}%;height:100%;background:${col};border-radius:6px;min-width:2px"></div></div><div style="width:66px;flex:none;font-size:12px;font-weight:700">${d.lab||fmt(d.v)}${unit}</div></div>`;
  }).join("")+`</div>`;
}
/* waterfall: steps=[{k,v,kind}] kind: 'abs' (pillar to value) or 'delta' (float) */
function svgWaterfall(steps,{h=210,fmt=(v)=>money(v)}={}){
  const W=560,top=18,bottom=42,left=6,right=6;
  let run=0;const pts=steps.map(s=>{if(s.kind==='total'||s.kind==='abs'){const y0=0,y1=s.v;run=s.v;return {s,lo:Math.min(y0,y1),hi:Math.max(y0,y1),tot:true};}else{const y0=run,y1=run+s.v;run=y1;return {s,lo:Math.min(y0,y1),hi:Math.max(y0,y1),tot:false};}});
  const vals=pts.flatMap(p=>[p.lo,p.hi]);const max=Math.max(...vals,0)*1.1,min=Math.min(...vals,0)*1.1;
  const iw=W-left-right,ih=h-top-bottom,bw=iw/steps.length,yy=v=>top+ih*(1-(v-min)/(max-min));
  let s=`<svg viewBox="0 0 ${W} ${h}">`;s+=`<line class="axl" x1="${left}" y1="${yy(0).toFixed(1)}" x2="${W-right}" y2="${yy(0).toFixed(1)}"/>`;
  pts.forEach((p,i)=>{const x=left+i*bw+bw*0.2,w=bw*0.6,yh=yy(p.lo),yl=yy(p.hi);
    const col=p.tot?'var(--ink)':(p.s.v<0?'var(--neg)':'var(--green)');
    s+=`<rect x="${x.toFixed(1)}" y="${yl.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(2,yh-yl).toFixed(1)}" rx="2" fill="${col}" data-t="${p.s.k}: ${fmt(p.s.v)}"/>`;
    s+=`<text class="axt" x="${(x+w/2).toFixed(1)}" y="${(yl-4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">${fmt(p.s.v)}</text>`;
    s+=`<text class="axt" x="${(x+w/2).toFixed(1)}" y="${h-bottom+13}" text-anchor="middle">${p.s.k.length>12?p.s.k.slice(0,11)+'…':p.s.k}</text>`;});
  return s+`</svg>`;
}

function stub(t,s){return `<div class="stub"><b>${t}</b><br>Em construção (v2). Subtabs previstos: ${s}.</div>`;}

/* ========================================================= NAV / ROUTER = */
function buildNav(){
  const nav=$("#navlist");let last=null;
  TABS.forEach((t,i)=>{
    if(t.grp!==last){nav.appendChild(el("div","grp",`<i style="background:${GRP_COLOR[t.grp]}"></i>${t.grp}`));last=t.grp;}
    const nb=el("button",i===0?"on":"");nb.dataset.tab=t.id;
    nb.innerHTML=`<svg class="nav-ic" viewBox="0 0 24 24"><path d="${t.icon}"/></svg><span>${t.label}</span>`;
    nb.onclick=()=>{go(t.id);if(window.innerWidth<=860)document.body.classList.add("snav-collapsed");};
    nav.appendChild(nb);
  });
}
const rendered={};
function go(id){
  TABS.forEach(t=>{
    $(`#${t.id}`).classList.toggle("on",t.id===id);
    $$(`[data-tab="${t.id}"]`).forEach(b=>b.classList.toggle("on",t.id===id));
  });
  const p=$(`#${id}`);
  if(!rendered[id]){p.innerHTML=R[id]();bindTips(p);bindSub(p);rendered[id]=1;}
  $("#mobTab").textContent=(TABS.find(t=>t.id===id)||{}).label||"";
  window.scrollTo({top:0,behavior:"instant"});
}
function bindSub(root){
  $$(".subtabs",root).forEach(st=>{
    const host=st.parentElement;
    st.addEventListener("click",e=>{
      const b=e.target.closest("button");if(!b)return;
      $$("button",st).forEach(x=>x.classList.toggle("on",x===b));
      $$(":scope > .subpane",host).forEach(pn=>pn.classList.toggle("on",pn.dataset.p===b.dataset.s));
      window.scrollTo({top:0,behavior:"instant"});
    });
  });
}
function setHH(){const h=$("header").offsetHeight;document.documentElement.style.setProperty("--hh",h+"px");}

buildNav();go("p-sum");setHH();
window.addEventListener("resize",setHH);
$("#navToggle").onclick=()=>document.body.classList.toggle("snav-collapsed");
if(window.innerWidth<=860)document.body.classList.add("snav-collapsed");
</script>
