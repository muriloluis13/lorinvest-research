<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chilli Beans (New Money) — Guia de Investimento · Akron/Lorinvest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F7; --card:#FFFFFF; --ink:#1A1A1A; --muted:#6A6A6E;
  --accent:#2B2B2E; --accent2:#55565A; --accent3:#E4002B;
  --red:#E4002B; --neg:#B3261E; --green:#2E7D4F; --amber:#B8860B;
  --line:#E6E6E9; --chip:#F0F0F2; --graf:#3A3A3E;
  --shadow:0 1px 2px rgba(26,26,26,.05),0 4px 14px rgba(26,26,26,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1,'lnum' 1}
button{font-family:inherit;cursor:pointer}
svg text{font-feature-settings:'tnum' 1,'lnum' 1}
b,strong{font-weight:700}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(26,26,26,.05)}
header::before{content:'';display:block;height:3px;background:linear-gradient(90deg,#1A1A1A,#1A1A1A 55%,var(--red))}
.hwrap{max-width:1680px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:#1A1A1A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;position:relative}
.logo .mark::after{content:'';position:absolute;right:5px;bottom:5px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.logo .nm{font-weight:800;font-size:15.5px;letter-spacing:-.3px;line-height:1}
.logo .nm small{display:block;font-weight:600;font-size:9px;letter-spacing:.14em;color:var(--muted);margin-top:3px}
.hsep{width:1px;height:26px;background:var(--line)}
.hsub{align-self:center;font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.htitle{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.hspace{flex:1}
.hconf{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--red);padding:4px 10px;border-radius:6px}
.mob-tab{display:none}

/* ---------- kpis ---------- */
#kpis{margin:0;padding:14px 18px 4px;max-width:1680px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px 13px;position:relative;display:flex;flex-direction:column;min-height:118px;min-width:0}
.kpi .lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-size:23px;font-weight:800;margin-top:8px;letter-spacing:-.6px;line-height:1.1;white-space:nowrap}
.kpi .sub{margin-top:auto;font-size:10.5px;color:var(--muted);padding-top:6px}
.kpi.k-feat{background:#1A1A1A;border-color:#1A1A1A}
.kpi.k-feat .lbl{color:rgba(255,255,255,.6)}
.kpi.k-feat .val{color:#fff}
.kpi.k-feat .sub{color:rgba(255,255,255,.72)}
.kpi.k-feat .val .u{color:var(--red)}

/* ---------- nav tabs ---------- */
nav#tabs{max-width:1680px;margin:6px auto 0;padding:0 18px;display:flex;gap:1px;border-bottom:2px solid var(--line);flex-wrap:wrap;align-items:flex-end}
nav#tabs button{background:none;border:none;font-size:12.5px;font-weight:600;color:var(--muted);padding:9px 11px;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:color .15s;white-space:nowrap}
nav#tabs button:hover{color:var(--accent)}
nav#tabs button.on{color:var(--ink);border-bottom-color:var(--accent3)}
.tgrp{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding:0 4px 8px;opacity:.85}
.tgrp i{width:7px;height:7px;border-radius:2px;display:inline-block}
.tdiv{width:1px;background:var(--line);margin:6px 5px 8px;align-self:stretch}

/* ---------- layout + sidebar ---------- */
.layout{display:flex;max-width:1680px;margin:0 auto;align-items:flex-start}
.maincol{flex:1;min-width:0}
#sidebar{width:212px;flex:none;position:sticky;top:var(--hh,66px);align-self:flex-start;max-height:calc(100vh - var(--hh,66px));overflow-y:auto;padding:8px 8px 26px;border-right:1px solid var(--line);transition:width .18s ease,padding .18s ease}
body.snav-collapsed #sidebar{width:0;padding:0;overflow:hidden;border-right:none}
#navlist .grp{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:13px 10px 5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#navlist .grp i{width:7px;height:7px;border-radius:2px;flex:none}
#navlist button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;border-left:2.5px solid transparent;font-size:12.5px;font-weight:600;color:var(--muted);padding:7px 11px;border-radius:0 7px 7px 0;white-space:nowrap;cursor:pointer;transition:background .12s,color .12s}
#navlist .nav-ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#navlist button:hover{color:var(--accent);background:#F0F0F2}
#navlist button.on{color:var(--ink);border-left-color:var(--accent3);background:#F4EAEC}
#navToggle{background:#fff;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:700;color:var(--accent);padding:3px 10px;cursor:pointer;line-height:1.2}
#navToggle:hover{background:#F2F2F4;border-color:var(--accent2)}
@media(max-width:860px){
  #sidebar{position:fixed;left:0;top:var(--hh,66px);z-index:60;background:#fff;box-shadow:3px 0 16px rgba(26,26,26,.14);height:calc(100vh - var(--hh,66px));max-height:none}
  header{background:var(--bg);border-bottom:none;box-shadow:none}
  header::before{display:none}
  .hsep,.hconf{display:none}
  .hwrap>div:not(.logo):not(#navToggle){display:none}
  .mob-tab{display:block;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:700;color:var(--ink)}
  .logo{margin-left:6px}
}

/* ---------- main + cards ---------- */
main{margin:0;padding:18px 22px 60px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px 19px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:14.5px;font-weight:700;margin-bottom:3px;letter-spacing:-.1px}
.card .cap{font-size:12.5px;line-height:1.5;color:#5A5A5E;margin-bottom:12px}
.card .lead{font-size:14px;line-height:1.62;color:var(--ink);margin:2px 0 14px}
.card.tinted{background:#FAF3F4;border-color:#F1D9DD}
.card.dark{background:#1A1A1A;border-color:#1A1A1A;color:#fff}
.card.dark h2{color:#fff}.card.dark .cap{color:rgba(255,255,255,.66)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row31{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:820px){.row2,.row3,.row31{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto}

.section-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:12px}
.section-head .title-icon{flex:none;width:30px;height:30px;border-radius:9px;background:#F4EAEC;color:var(--red);display:flex;align-items:center;justify-content:center;margin-top:1px}
.section-head .title-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.section-head .head-copy{flex:1;min-width:0}
.section-head h2{margin-bottom:2px}
.section-head .tag{flex:none;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--chip);padding:4px 10px;border-radius:20px;align-self:center}

/* subtabs */
.subtabs{display:inline-flex;gap:4px;background:#EEEEF0;border:1px solid var(--line);border-radius:10px;padding:4px;margin:0 2px 16px;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:none;background:none;font-size:12.5px;font-weight:700;color:var(--muted);padding:7px 16px;border-radius:7px;cursor:pointer;transition:background .12s,color .12s;flex:0 0 auto;white-space:nowrap}
.subtabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.subpane{display:none}.subpane.on{display:block}

/* kv / grids */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px}
.kv .k{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kv .v{font-size:13.5px;font-weight:600;margin-top:2px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.stat4 .st{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#FBFBFC}
.stat4 .st .n{font-size:22px;font-weight:800;letter-spacing:-.5px}
.stat4 .st .c{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
@media(max-width:820px){.stat4{grid-template-columns:repeat(2,1fr)}}

/* steps / blocks */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.steps.s3{grid-template-columns:repeat(3,1fr)}
.steps.s5{grid-template-columns:repeat(5,1fr)}
.step{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#FBFBFC;position:relative}
.step .n{font-size:10px;font-weight:700;color:var(--red);letter-spacing:.08em;text-transform:uppercase}
.step b{display:block;font-size:13px;margin:5px 0 3px}
.step p{font-size:11.6px;color:#50505A;line-height:1.5}
@media(max-width:900px){.steps,.steps.s5{grid-template-columns:repeat(2,1fr)}.steps.s3{grid-template-columns:1fr}}

/* tables */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
td{font-size:12.5px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:#FAFAFB}
tr.tot td{font-weight:700;border-top:2px solid var(--accent2);background:#F5F5F6}
td.neg{color:var(--neg)}
.opt table td.l{font-weight:600}
.opt thead th{text-align:center;color:var(--ink);font-size:11px}
.opt thead th.hl{color:var(--red)}
.opt td{text-align:center}
.opt .colB{background:#FAF3F4}

/* pills / notes */
.pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block}
.pill.red{background:#F4EAEC;color:var(--red)}
.pill.grn{background:#E7F0EA;color:var(--green)}
.pill.gry{background:var(--chip);color:var(--muted)}
.pill.amb{background:#F7EFD9;color:var(--amber)}
.note{border-left:3px solid var(--accent3);background:#FAF3F4;border-radius:0 10px 10px 0;padding:11px 14px;font-size:12px;color:#5A3B40;margin-top:12px;line-height:1.5}
.note b{color:var(--red)}
.note.warn{border-left-color:var(--amber);background:#FBF6E9;color:#6B5417}
.note.warn b{color:var(--amber)}
.warn-txt{font-size:11px;color:var(--muted);margin-top:8px}

/* rationale blocks */
.rat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rat .r{border:1px solid var(--line);border-top:3px solid var(--red);border-radius:11px;padding:13px 15px;background:#fff}
.rat .r .t{font-size:12.5px;font-weight:700;margin-bottom:4px}
.rat .r p{font-size:11.6px;color:#50505A;line-height:1.5}
@media(max-width:900px){.rat{grid-template-columns:repeat(2,1fr)}}

/* risks */
.risks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.risk{border:1px solid var(--line);border-left:3px solid var(--pc,#8A8A8E);border-radius:11px;padding:12px 14px 13px;background:var(--card);box-shadow:var(--shadow)}
.risk .rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.risk .rt{font-size:12.5px;font-weight:700;line-height:1.25}
.risk .rb{flex-shrink:0;font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.risk .rd{font-size:11.5px;color:var(--muted);line-height:1.42}

/* timeline vertical */
.tml{position:relative;margin:6px 0 2px;padding-left:26px}
.tml::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tml .ev{position:relative;padding:0 0 16px 4px}
.tml .ev::before{content:'';position:absolute;left:-23px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--accent2)}
.tml .ev.hot::before{border-color:var(--red);background:var(--red)}
.tml .ev .yr{font-size:11px;font-weight:700;color:var(--red)}
.tml .ev .tt{font-size:12.8px;font-weight:600;margin:1px 0 1px}
.tml .ev .dd{font-size:11.5px;color:var(--muted);line-height:1.45}

/* horizontal chrono */
.chrono{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;position:relative}
.chrono .c{border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:#FBFBFC}
.chrono .c .dt{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.05em}
.chrono .c .h{font-size:12.5px;font-weight:700;margin:4px 0 2px}
.chrono .c p{font-size:11px;color:#50505A;line-height:1.45}
@media(max-width:900px){.chrono{grid-template-columns:1fr 1fr}}

/* cascade */
.casc{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.casc .lv{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#fff;position:relative}
.casc .lv .rk{width:26px;height:26px;flex:none;border-radius:7px;background:#1A1A1A;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.casc .lv.p1{border-color:var(--red);background:#FAF3F4}.casc .lv.p1 .rk{background:var(--red)}
.casc .lv .nm{font-weight:700;font-size:13px}
.casc .lv .ds{font-size:11px;color:var(--muted)}
.casc .arrow{text-align:center;color:var(--muted);font-size:14px;line-height:.6}

/* flow diagram (business model / rollup / sweep) */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .fn{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#FBFBFC;text-align:center}
.flow .fn .ft{font-size:12px;font-weight:700}
.flow .fn .fs{font-size:10.5px;color:var(--muted);margin-top:2px}
.flow .fa{display:flex;align-items:center;justify-content:center;padding:0 6px;color:var(--red);font-weight:800;font-size:17px}
@media(max-width:820px){.flow{flex-direction:column}.flow .fa{transform:rotate(90deg);padding:4px 0}}

.src{font-size:10.5px;color:var(--muted);margin-top:9px;font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:10px}
.legend span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.axt{font-size:11px;fill:var(--muted)}
.axl{stroke:var(--line);stroke-width:1}
.stub{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;background:#FBFBFC}
.stub b{color:var(--accent);font-weight:700}
#tip{position:fixed;z-index:99;pointer-events:none;background:#1A1A1A;color:#fff;font-size:11px;padding:7px 10px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:300px;white-space:pre-line;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <button id="navToggle" title="Menu">☰</button>
    <div class="logo">
      <div class="mark">C</div>
      <div class="nm">Chilli Beans<small>NEW MONEY · GUIA DE INVESTIMENTO</small></div>
    </div>
    <div class="hsep"></div>
    <div class="hsub">Akron · Lorinvest</div>
    <div class="mob-tab" id="mobTab">Sumário</div>
    <div class="hspace"></div>
    <div class="hconf">Confidencial · Buy-side</div>
  </div>
  <div id="kpis"><div class="kpis" id="kpiRow"></div></div>
  <nav id="tabs"></nav>
</header>

<div class="layout">
  <aside id="sidebar"><div id="navlist"></div></aside>
  <div class="maincol">
    <main>
      <section class="panel on" id="p-sum"></section>
      <section class="panel" id="p-cia"></section>
      <section class="panel" id="p-setor"></section>
      <section class="panel" id="p-news"></section>
      <section class="panel" id="p-sit"></section>
      <section class="panel" id="p-val"></section>
      <section class="panel" id="p-risco"></section>
      <section class="panel" id="p-anexo"></section>
    </main>
  </div>
</div>
<div id="tip"></div>

<script>
/* ============================================================= DATA ===== */
const F = {
  // ---- KPIs (deck New Money set/26) ----
  kpis:[
    {lbl:"Investimento Akron",val:"R$ 4,375 mm",sub:"New Money (de R$ 35 mm)"},
    {lbl:"TIR — New Money",val:"37% <span class='u'>a.a.</span>",sub:"30 meses",feat:true},
    {lbl:"MOIC — New Money",val:"1,7x",sub:"mín. contratual 1,5x"},
    {lbl:"Payback",val:"23 meses",sub:"lucro líq. R$ 2,9 mm"},
    {lbl:"Exposição Akron (pós)",val:"R$ 8,8 mm",sub:"antiga R$ 4,4 mm + NM 4,375"},
    {lbl:"Prioridade",val:"Sênior",sub:"1º na cascata + AF ações/marca"},
  ],
  snapshot:[
    {n:"872",c:"lojas (mai/26)"},{n:"26%",c:"share em óculos de sol (vol.)"},
    {n:"R$ 368 mm",c:"faturamento 2025"},{n:"R$ 997 mm",c:"sell-out da rede 2025"},
    {n:"256",c:"franqueados"},{n:"100%",c:"lojas franqueadas (asset-light)"},
    {n:"1998",c:"fundação (Caito Maia)"},{n:"10,4x",c:"dívida líq./EBITDA (as-is)"},
  ],
  // ---- return scenarios (New+Old Money, deck p.31) ----
  scen:[
    {k:"Base c/ M&A",tir:"65% a.a.",moic:"3,0x",ll:"R$ 18 mm",when:"M&A dez/28",tone:"grn",
     prem:["EBITDA R$ 53 mm (2027) e R$ 79 mm (2028)","M&A em dez/28 amortiza antecipadamente todos os créditos"]},
    {k:"Base s/ M&A",tir:"35% a.a.",moic:"2,2x",ll:"R$ 11 mm",when:"pagamentos até 2031",tone:"gry",
     prem:["Mesmo EBITDA da base, sem M&A","Recebimentos limitados ao New Money e Tranche 1 até ago/31"]},
    {k:"Conservador",tir:"16% a.a.",moic:"1,3x",ll:"R$ 3 mm",when:"refin. relevante a partir de jul/29",tone:"amb",
     prem:["EBITDA R$ 40 mm (2027) e R$ 47 mm (2028)","944→814 lojas (-13,8%) em 26; 678 (-16,7%) em 27","Sell-out/loja -24,5% em 26 e -2,0% em 27"]},
  ],
  // ---- debt composition (deck p.15) ----
  debt:{total:551, parts:[
    {k:"Financeira",v:424,c:"var(--ink)"},{k:"Aval",v:36,c:"var(--graf)"},
    {k:"Fiscal",v:71,c:"var(--accent2)"},{k:"Fornecedores",v:20,c:"#A9A9AD"}],
    cred:[{k:"Banco do Brasil",v:96.4,p:"23%"},{k:"Caixa",v:71.6,p:"17%"},{k:"Deb. Vert (Mustang)",v:87.0,p:"21%"}]},
  // ---- crisis 5 factors (deck p.9) ----
  crise:[
    {t:"Endividamento na pandemia",p:"Alavancagem alta com avais a franqueados de alto risco, que inadimpliram."},
    {t:"Retiradas do sócio",p:"Retiradas elevadas do controlador nos últimos anos, mesmo em cenário desafiador."},

const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function tip(e,txt){const t=$("#tip");t.textContent=txt;t.style.display="block";const m=ev=>{t.style.left=(ev.clientX+14)+"px";t.style.top=(ev.clientY+14)+"px";};m(e);e.target.__m=m;e.target.addEventListener("mousemove",m);}
function untip(e){const t=$("#tip");t.style.display="none";if(e.target.__m)e.target.removeEventListener("mousemove",e.target.__m);}
const money=v=>v.toLocaleString("pt-BR",{maximumFractionDigits:1});

/* simple vertical bar chart: data=[{k,v,c?}] */
function svgBars(data,{h=200,unit="",fmt=(v)=>money(v),pad=28}={}){
  const W=520,H=h,left=8,right=8,top=14,bottom=30;
  const max=Math.max(...data.map(d=>d.v))*1.12||1;
  const iw=W-left-right, bw=iw/data.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let g=0;g<=3;g++){const y=top+(H-top-bottom)*g/3;const val=max*(1-g/3);
    s+=`<line class="axl" x1="${left}" y1="${y}" x2="${W-right}" y2="${y}"/>`;
    s+=`<text class="axt" x="${left}" y="${y-3}">${fmt(val)}</text>`;}
  data.forEach((d,i)=>{
    const bh=(d.v/max)*(H-top-bottom);const x=left+i*bw+bw*0.18;const bwid=bw*0.64;const y=H-bottom-bh;
    s+=`<rect x="${x}" y="${y}" width="${bwid}" height="${bh}" rx="3" fill="${d.c||'var(--ink)'}" data-t="${d.k}: ${fmt(d.v)}${unit}"/>`;
    s+=`<text class="axt" x="${x+bwid/2}" y="${H-bottom+14}" text-anchor="middle">${d.k}</text>`;
    s+=`<text x="${x+bwid/2}" y="${y-4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">${fmt(d.v)}</text>`;
  });
  s+=`</svg>`;return s;
}

/* horizontal waterfall / composition: items=[{k,v,c}], with total */
function svgHBars(items,{unit="R$ mm",fmt=money}={}){
  const max=Math.max(...items.map(d=>d.v))*1.05||1;
  let s=`<div style="display:flex;flex-direction:column;gap:9px">`;
  items.forEach(d=>{
    const w=(d.v/max*100).toFixed(1);
    s+=`<div style="display:flex;align-items:center;gap:10px">
      <div style="width:112px;flex:none;font-size:12px;font-weight:600;text-align:right;color:var(--ink)">${d.k}</div>
      <div style="flex:1;background:#F0F0F2;border-radius:6px;height:22px;position:relative">
        <div style="width:${w}%;height:100%;background:${d.c};border-radius:6px"></div>
      </div>
      <div style="width:70px;flex:none;font-size:12.5px;font-weight:700">${fmt(d.v)}</div></div>`;
  });
  s+=`</div>`;return s;
}
function bindTips(root){$$("[data-t]",root).forEach(n=>{n.addEventListener("mouseenter",e=>tip(e,n.getAttribute("data-t")));n.addEventListener("mouseleave",untip);n.style.cursor="default";});}

function stub(t,s){return `<div class="stub"><b>${t}</b><br>Em construção (v2). Subtabs previstos: ${s}.</div>`;}

/* ========================================================= NAV / ROUTER = */
function buildNav(){
  const tabs=$("#tabs"), nav=$("#navlist");
  let last=null;
  TABS.forEach((t,i)=>{
    if(t.grp!==last){
      tabs.appendChild(el("div","tgrp",`<i style="background:${GRP_COLOR[t.grp]}"></i>${t.grp}`));
      if(i>0){}
      nav.appendChild(el("div","grp",`<i style="background:${GRP_COLOR[t.grp]}"></i>${t.grp}`));
      last=t.grp;
    }
    const b=el("button",i===0?"on":"",t.label);b.dataset.tab=t.id;b.onclick=()=>go(t.id);tabs.appendChild(b);
    const nb=el("button",i===0?"on":"");nb.dataset.tab=t.id;
    nb.innerHTML=`<svg class="nav-ic" viewBox="0 0 24 24"><path d="${t.icon}"/></svg><span>${t.label}</span>`;
    nb.onclick=()=>{go(t.id);if(window.innerWidth<=860)document.body.classList.add("snav-collapsed");};
    nav.appendChild(nb);
  });
}
const rendered={};
function go(id){
  TABS.forEach(t=>{
    $(`#${t.id}`).classList.toggle("on",t.id===id);
    $$(`[data-tab="${t.id}"]`).forEach(b=>b.classList.toggle("on",t.id===id));
  });
  const p=$(`#${id}`);
  if(!rendered[id]){p.innerHTML=R[id]();bindTips(p);bindSub(p);rendered[id]=1;}
  $("#mobTab").textContent=(TABS.find(t=>t.id===id)||{}).label||"";
  window.scrollTo({top:0,behavior:"instant"});
}
function bindSub(root){
  $$(".subtabs",root).forEach(st=>{
    const panes=st.parentElement;
    st.addEventListener("click",e=>{
      const b=e.target.closest("button");if(!b)return;
      $$("button",st).forEach(x=>x.classList.toggle("on",x===b));
      $$(":scope > .subpane",panes).forEach(pn=>pn.classList.toggle("on",pn.dataset.p===b.dataset.s));
      window.scrollTo({top:0,behavior:"instant"});
    });
  });
}
function buildKPIs(){
  $("#kpiRow").innerHTML=F.kpis.map(k=>`<div class="kpi ${k.feat?'k-feat':''}"><div class="lbl">${k.lbl}</div><div class="val">${k.val}</div><div class="sub">${k.sub}</div></div>`).join("");
}
function setHH(){const h=$("header").offsetHeight;document.documentElement.style.setProperty("--hh",h+"px");}

/* init */
buildKPIs();buildNav();go("p-sum");setHH();
window.addEventListener("resize",setHH);
$("#navToggle").onclick=()=>document.body.classList.toggle("snav-collapsed");
if(window.innerWidth<=860)document.body.classList.add("snav-collapsed");
</script>
