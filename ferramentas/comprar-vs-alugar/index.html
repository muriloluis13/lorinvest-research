<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprar vs. Alugar — Simulador Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --ink:#13202E; --muted:#5C6B7A;
  --accent:#3D4A5C; --accent2:#55677C; --accent3:#E23A2E; --orange:#C55A17;
  --green:#2E7D4F; --line:#E2E7EE; --neg:#B23A3A; --chip:#EDF1F6;
  --slate:#3D4A5C; --red:#E23A2E; --mint:#7FC6A2; --blue:#2C6E9B;
  --shadow:0 1px 2px rgba(19,32,46,.05),0 4px 14px rgba(19,32,46,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1,'lnum' 1}
button,input,select{font-family:inherit}
svg text{font-feature-settings:'tnum' 1,'lnum' 1}
header{position:sticky;top:0;z-index:50;background:#fff;color:var(--accent);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(35,39,42,.05)}
header::before{content:'';display:block;height:3px;background:linear-gradient(90deg,var(--slate),var(--accent2) 55%,var(--red))}
.hwrap{max-width:1680px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.hbrand{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.hsep{width:1px;height:26px;background:var(--line)}
.htitle{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.hsub{font-size:11px;color:var(--muted)}
.hspace{flex:1}
#navToggle{background:#fff;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:700;color:var(--accent);padding:3px 10px;cursor:pointer;line-height:1.2}
nav#tabs{max-width:1680px;margin:0 auto;padding:0 18px;display:flex;gap:1px;border-bottom:2px solid var(--line);flex-wrap:wrap;align-items:flex-end}
nav#tabs button{background:none;border:none;font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 13px;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:color .15s;white-space:nowrap;cursor:pointer}
nav#tabs button:hover{color:var(--accent)}
nav#tabs button.on{color:var(--accent);border-bottom-color:var(--accent3)}
main{max-width:1680px;margin:0 auto;padding:18px 22px 60px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px 19px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:14.5px;font-weight:700;margin-bottom:3px}
.card .cap{font-size:12.5px;line-height:1.5;color:#46566A;margin-bottom:12px}
.card .lead{font-size:14px;line-height:1.62;color:var(--ink);margin:2px 0 14px}
h3.msub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:16px 0 9px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--line)}
h3.msub:first-child{margin-top:2px}
/* Simulator layout */
.mscen{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media(min-width:1080px){.mscen{grid-template-columns:300px 1fr}.mprem{position:sticky;top:80px;max-height:calc(100vh - 96px);overflow-y:auto}}
.mout{display:flex;flex-direction:column;gap:14px;min-width:0}
.mprem h2{font-size:15px}
.mrow{margin-bottom:11px}
.mrow label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:5px;gap:8px}
.mrow label span:first-child{color:#42505F}
.mrow .mval{color:var(--accent3);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow input[type=range]{width:100%;height:4px;border-radius:3px;accent-color:var(--accent3);cursor:pointer}
.mrow select,.mrow input[type=text]{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12.5px;color:var(--ink);background:#fff}
.selfin{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 9px;font-size:12.5px;background:#fff}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:#42505F;margin-bottom:9px}
.sw{position:relative;width:40px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#CBD3DD;border-radius:22px;transition:.15s;cursor:pointer}
.sw span::before{content:'';position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked + span{background:var(--accent3)}
.sw input:checked + span::before{transform:translateX(18px)}
.mkpis{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
@media(max-width:640px){.mkpis{grid-template-columns:1fr 1fr}}
.mkpi{border-radius:12px;padding:13px 14px;border:1px solid rgba(0,0,0,.04)}
.mkpi .cap{font-size:10px;font-weight:700;letter-spacing:.03em;color:#5A6675;text-transform:uppercase}
.mkpi .val{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-top:4px;color:var(--ink);white-space:nowrap}
.mkpi .sub{font-size:10.5px;color:#6B7787;margin-top:3px;line-height:1.35}
.mkpi.k-slate{background:#EAF0F6}.mkpi.k-teal{background:#E4EEEC}.mkpi.k-red{background:#FBECEA}.mkpi.k-sage{background:#E7EEE3}.mkpi.k-stone{background:#EAEDF2}.mkpi.k-blue{background:#E6EFF5}
.mkpi.k-red .val{color:var(--accent3)}.mkpi.k-sage .val{color:var(--green)}.mkpi.k-blue .val{color:var(--blue)}
.verdict{font-size:15px;line-height:1.6;background:#EAF0F6;border-left:3px solid var(--accent);border-radius:8px;padding:13px 15px;margin-top:4px}
.verdict b{color:var(--accent3)}
.mtwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.mtbl{border-collapse:separate;border-spacing:0;font-size:11.5px;white-space:nowrap;min-width:100%}
table.mtbl th,table.mtbl td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line)}
table.mtbl th{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;position:sticky;top:0;background:#fff}
table.mtbl td:first-child,table.mtbl th:first-child{text-align:left}
table.mtbl tr:hover td{background:#F7F9FB}
.pos{color:var(--green)}.neg{color:var(--accent3)}
.careertbl{width:100%;border-collapse:collapse;font-size:12px}
.careertbl th{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;text-align:left;padding:5px 6px}
.careertbl td{padding:4px 6px}
.careertbl input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:12px;text-align:right}
.careertbl input.txt{text-align:left}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--accent)}
.warn{font-size:12px;color:var(--accent3);font-weight:600;margin-top:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:#42505F;margin:2px 0 8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mbtn{border:1px solid var(--accent3);background:#fff;color:var(--accent3);font-weight:700;font-size:11.5px;padding:6px 13px;border-radius:7px;cursor:pointer}
.mbtn:hover{background:var(--accent3);color:#fff}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div><div class="hbrand">Lorinvest · Ferramentas</div><div class="htitle">Comprar vs. Alugar</div></div>
    <span class="hsep"></span>
    <div class="hsub">Simulador de decisão patrimonial pessoal — financiamento imobiliário vs. alugar e investir a diferença</div>
    <div class="hspace"></div>
    <button class="mbtn" onclick="resetAll()">Restaurar premissas</button>
  </div>
  <nav id="tabs">
    <button class="on" onclick="showTab('veredito',this)">Veredito</button>
    <button onclick="showTab('compra',this)">Compra &amp; financiamento</button>
    <button onclick="showTab('aluguel',this)">Aluguel &amp; investimento</button>
    <button onclick="showTab('carreira',this)">Carreira &amp; receitas</button>
    <button onclick="showTab('sens',this)">Sensibilidade</button>
  </nav>
</header>
<main>
  <div class="mscen">
    <section class="card mprem" id="prem"><h2>Premissas</h2><div id="premBody"></div></section>
    <div class="mout">
      <section class="panel on" id="p-veredito"></section>
      <section class="panel" id="p-compra"></section>
      <section class="panel" id="p-aluguel"></section>
      <section class="panel" id="p-carreira"></section>
      <section class="panel" id="p-sens"></section>
    </div>
  </div>
</main>

<script>
/* ============================================================
   CATÁLOGO DE INSTRUMENTOS — raspado de financiamento.com.br
   (residencial · usado · RJ · Rio de Janeiro · em 2026-09-16)
   MIP idêntico em todas as linhas (CaixaSeg); DFI = 0,000163 s/ valor do imóvel.
   taxaini = taxa de juros efetiva anual. corr = indexador (TR ~ 0 hoje).
   ============================================================ */
var MIP_STD=[[18,0.0002],[26,0.000227],[31,0.00027],[36,0.00034],[41,0.000503],[46,0.000773],[51,0.001422],[56,0.001992],[61,0.003343],[66,0.004229],[71,0.007631],[76,0.010869]];
var DFI_STD=0.000163;
function I(cod,agfi,nome,taxa,sifi,mofi,fgts,vmin,vmax,vfmin,vfmax,pfm,prmin,prmax,compr){
  return {cod:cod,agfi:agfi,nome:nome,taxaini:taxa,sifi:sifi,sistema:mofi,fgts:fgts,valmin:vmin,valmax:vmax,valfinmin:vfmin,valfinmax:vfmax,percfinmax:pfm,prmin:prmin,prmax:prmax,compr:compr,mip:MIP_STD,dfi:DFI_STD};
}
var INSTR=[
 I("6313","HSBC","Taxa Mercado Residencial",0.089,"CH","SAC",false,750000,0,600000,0,0.8,12,360,0.30),
 I("6155","Santander","Aquisição Residencial — Conta Salário — Até R$ 750 mil (SP/MG/RJ/DF)",0.091,"SFH","SAC",true,100000,750000,20000,600000,0.8,12,420,0.30),
 I("6351","Santander","Aquisição Residencial — Conta Salário — Até R$ 650 mil (Outros Estados)",0.091,"SFH","SAC",true,100000,650000,20000,520000,0.8,12,420,0.30),
 I("6352","Santander","Aquisição Residencial acima de R$ 650 mil — Conta Salário (Outros Estados)",0.091,"CH","SAC",false,650000,0,520000,0,0.8,12,420,0.30),
 I("6353","Santander","Aquisição Residencial acima de R$ 750 mil — Conta Salário (SP/RJ/MG/DF)",0.091,"CH","SAC",false,750000,0,600000,0,0.8,12,420,0.30),
 I("6314","HSBC","SFH — de R$ 150 mil a R$ 750 mil",0.092,"SFH","SAC",true,150000,750000,120000,600000,0.8,12,360,0.30),
 I("6092","Banco do Brasil","Até 750 mil — SAC — SFH — clientes em dia — conta salário",0.094,"SFH","SAC",true,100000,750000,20000,600000,0.8,18,360,0.30),
 I("6305","Banco do Brasil","750,01 mil a 10 milhões — SAC — CH — clientes em dia — conta salário",0.094,"CH","SAC",false,750000,10000000,20000,5000000,0.8,18,360,0.30),
 I("6091","Banco do Brasil","Até 750 mil — SAC — SFH — parcelas em dia",0.095,"SFH","SAC",true,100000,750000,20000,600000,0.8,18,360,0.30),
 I("6094","Banco do Brasil","750,01 mil a 10 milhões — SAC — CH — clientes em dia",0.095,"CH","SAC",false,750000,10000000,20000,5000000,0.8,18,360,0.30),
 I("6089","Banco do Brasil","Até 750 mil — SAC — SFH",0.096,"SFH","SAC",true,100000,750000,20000,600000,0.8,18,360,0.30),
 I("6093","Banco do Brasil","750,01 mil a 10 milhões — SAC — Carteira Hipotecária",0.096,"CH","SAC",false,750000,10000000,20000,5000000,0.8,18,360,0.30),
 I("6193","Itaú Credipronto","Imóvel Residencial — Acima de 750 mil",0.097,"CH","SAC",false,750000,0,600000,0,0.8,12,360,0.35),
 I("6194","Itaú Credipronto","Imóvel Residencial — SFH — Até 750 mil",0.097,"SFH","SAC",true,100000,750000,50000,600000,0.8,12,360,0.35),
 I("6158","Santander","Aquisição — Taxa Fixa",0.125,"CH","PRICE",false,100000,0,20000,0,0.8,12,420,0.30)
];

/* ============================================================
   ESTADO
   ============================================================ */
var FIM_IDADE=65; // horizonte fixo: análise vai até os 65 anos
var BASE={
  // imóvel & financiamento
  valImovel:5000000, percFin:0.45, prazo:360, idade:27, cod:"6313",
  itbiPct:0.03, cartorioPct:0.015, corretagemPct:0.06,
  // custos mensais da compra
  condominioMensal:2500, iptuAnualPct:0.008,
  valorizReal:0.0,       // valorização REAL do imóvel (acima da inflação)
  // aluguel
  aluguelMensal:2800,    // reajuste do aluguel = inflação
  // mercado / você
  rendimentoAA:0.10, inflacaoAA:0.04,
  patrimonioInicial:180000,
  // carreira (comp = salário bruto mensal de entrada no nível; despesaPct = despesas ex-moradia como % da renda líquida)
  stages:[
    {nome:"Analista", ate:29, comp:15000,  cresc:0.05, clt:true,  bonus:1, despesaPct:0.70},
    {nome:"Gerente",  ate:32, comp:25000,  cresc:0.05, clt:true,  bonus:2, despesaPct:0.60},
    {nome:"Diretor",  ate:37, comp:60000,  cresc:0.05, clt:false, bonus:4, despesaPct:0.45},
    {nome:"Sócio",    ate:65, comp:120000, cresc:0.06, clt:false, bonus:6, despesaPct:0.35}
  ]
};
var S=JSON.parse(JSON.stringify(BASE));
function horizAnos(s){ return Math.max(1, FIM_IDADE-s.idade); }

/* ============================================================
   HELPERS
   ============================================================ */
var $=function(id){return document.getElementById(id);};
function brl(v,d){d=d==null?0:d; if(v==null||isNaN(v))return "—"; return "R$ "+v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function brlK(v){ if(v==null||isNaN(v))return "—"; var a=Math.abs(v); var s=v<0?"−":"";
  if(a>=1e6)return s+"R$ "+(a/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+" mi";
  if(a>=1e3)return s+"R$ "+(a/1e3).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})+" mil";
  return s+"R$ "+a.toLocaleString('pt-BR',{maximumFractionDigits:0});}
function pct(v,d){d=d==null?1:d; if(v==null||isNaN(v))return "—"; return (v*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+"%";}
function num(v,d){d=d==null?0:d; if(v==null||isNaN(v))return "—"; return v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function parseNum(v){ if(typeof v==='number')return v; var s=String(v).replace(/\./g,'').replace(',','.').replace(/[^0-9.\-]/g,''); var n=parseFloat(s); return isNaN(n)?0:n; }
function mipTaxa(ops,age){ var t=ops[0][1]; for(var i=0;i<ops.length;i++){ if(age>=ops[i][0]) t=ops[i][1]; } return t; }
function irRegressivo(dias){ if(dias<=180)return 0.225; if(dias<=360)return 0.20; if(dias<=720)return 0.175; return 0.15; }

/* --- Salário líquido: INSS + IRRF (tabelas 2025), replicando idinheiro.com.br --- */
function inssCalc(sal){ // desconto progressivo do INSS (empregado), com teto
  var b=[[1518.00,0.075],[2793.88,0.09],[4190.83,0.12],[8157.41,0.14]];
  var prev=0,t=0;
  for(var i=0;i<b.length;i++){ var up=b[i][0]; if(sal>prev) t+=(Math.min(sal,up)-prev)*b[i][1]; prev=up; }
  return t; // limitado automaticamente (teto de contribuição ~ R$ 951,63)
}
function irrfTabela(base){ // IRRF mensal sobre a base de cálculo
  var tb=[[2259.20,0,0],[2826.65,0.075,169.44],[3751.05,0.15,381.44],[4664.68,0.225,662.77],[1e12,0.275,896.00]];
  for(var i=0;i<tb.length;i++){ if(base<=tb[i][0]) return Math.max(0, base*tb[i][1]-tb[i][2]); }
  return 0;
}
function netFromGross(bruto){ // salário líquido mensal (sem dependentes), escolhe desconto completo ou simplificado
  if(bruto<=0) return 0;
  var inss=inssCalc(bruto);
  var baseCompleto=bruto-inss;      // dedução completa (INSS)
  var baseSimpl=bruto-564.80;       // desconto simplificado (25% da 1ª faixa: 2.259,20)
  var irrf=Math.min(irrfTabela(baseCompleto), irrfTabela(baseSimpl));
  return bruto-inss-irrf;
}
function irrfPLR(plrAnual){ // IRRF do bônus/PLR — tabela EXCLUSIVA anual (isenta de INSS)
  var tb=[[8214.40,0,0],[9922.28,0.075,616.08],[13167.00,0.15,1360.25],[16380.38,0.225,2348.00],[1e12,0.275,3167.00]];
  for(var i=0;i<tb.length;i++){ if(plrAnual<=tb[i][0]) return Math.max(0, plrAnual*tb[i][1]-tb[i][2]); }
  return 0;
}
function compNet(G, clt, bonus){ // decomposição anual da remuneração líquida
  var liqMes=netFromGross(G);                 // salário mensal líquido (INSS+IRRF mensal)
  var salParts=(12+(clt?2:0))*liqMes;         // 12 meses + 13º + férias (CLT)
  var bonusBruto=(bonus||0)*G;                // bônus/PLR bruto no ano (nº de salários)
  var bonusLiq=bonusBruto-irrfPLR(bonusBruto);// tabela exclusiva de PLR
  var anual=salParts+bonusLiq;
  return {liqMes:liqMes, salParts:salParts, bonusBruto:bonusBruto, bonusLiq:bonusLiq, anual:anual, media:anual/12};
}

/* ============================================================
   MOTOR DE CÁLCULO (puro — sem DOM)
   ============================================================ */
function elegiveis(s){
  var valFin=s.valImovel*s.percFin;
  return INSTR.filter(function(x){
    if(s.valImovel<x.valmin) return false;
    if(x.valmax>0 && s.valImovel>x.valmax) return false;
    if(valFin<x.valfinmin) return false;
    if(x.valfinmax>0 && valFin>x.valfinmax) return false;
    if(s.percFin>parseFloat(x.percfinmax)+1e-9) return false;
    if(s.prazo<x.prmin || s.prazo>x.prmax) return false;
    if(s.idade+s.prazo/12>80.5) return false;
    return true;
  });
}
function schedule(P,i_m,n,sistema,valImovel,idade,mip,dfi){
  var saldo=P, out={parc:[],juros:[],amort:[],saldo:[],seg:[]};
  var pmt = sistema==='PRICE' ? P*i_m/(1-Math.pow(1+i_m,-n)) : 0;
  var amortSAC=P/n;
  for(var k=0;k<n;k++){
    var age=idade+Math.floor(k/12);
    var mipV=mipTaxa(mip,age)*saldo;
    var dfiV=dfi*valImovel;
    var juros=saldo*i_m;
    var amort = sistema==='PRICE' ? (pmt-juros) : amortSAC;
    var base=juros+amort;
    saldo=Math.max(0,saldo-amort);
    out.juros.push(juros);out.amort.push(amort);out.saldo.push(saldo);out.seg.push(mipV+dfiV);
    out.parc.push(base+mipV+dfiV);
  }
  return out;
}
function stageAt(s,age){ // retorna {st, startAge}
  var start=s.idade;
  for(var i=0;i<s.stages.length;i++){
    var st=s.stages[i], end=(i<s.stages.length-1)?st.ate:1e9;
    if(age<end) return {st:st,start:start};
    start=end;
  }
  return {st:s.stages[s.stages.length-1], start:start};
}
function brutoMensal(s,m){ // salário BRUTO mensal no mês m (com crescimento anual dentro do nível)
  var age=s.idade+m/12, r=stageAt(s,age), y=Math.floor(age-r.start);
  return r.st.comp*Math.pow(1+r.st.cresc, y<0?0:y);
}
function rendaMensal(s,m){ // renda LÍQUIDA média mensal (salário via tabela mensal; bônus via tabela PLR)
  var age=s.idade+m/12, r=stageAt(s,age);
  var G=brutoMensal(s,m);
  return compNet(G, r.st.clt, r.st.bonus).media;
}
function compute(s){
  var elig=elegiveis(s);
  var instr=null; for(var i=0;i<INSTR.length;i++){ if(INSTR[i].cod===s.cod) instr=INSTR[i]; }
  var eligible = elig.indexOf(instr)>=0;
  if(!eligible) instr = elig.length? elig[0] : instr; // fallback
  var anos=horizAnos(s);
  var N=anos*12;
  var res={instr:instr, elig:elig, eligible:eligible, anos:anos};
  if(!instr){ res.empty=true; return res; }

  var i_m=Math.pow(1+instr.taxaini,1/12)-1;
  var valFin0=s.valImovel*s.percFin;
  var P=valFin0;
  var entradaCash=s.valImovel-valFin0;
  var custosAq=s.valImovel*(s.itbiPct+s.cartorioPct);
  var sched=schedule(P,i_m,s.prazo,instr.sistema,s.valImovel,s.idade,instr.mip,instr.dfi);

  var r_m=Math.pow(1+s.rendimentoAA,1/12)-1;
  var valorizNom=(1+s.inflacaoAA)*(1+s.valorizReal)-1;      // valorização real linkada à inflação
  var valoriz_m=Math.pow(1+valorizNom,1/12)-1;
  var aliq=irRegressivo(anos*365);

  var investBuy=s.patrimonioInicial-entradaCash-custosAq;
  var investRent=s.patrimonioInicial;
  var basisBuy=investBuy, basisRent=investRent;
  var aluguel=s.aluguelMensal, condo=s.condominioMensal;
  var valImovelAtual=s.valImovel;

  var wBuy=[],wRent=[],parcArr=[],rendaArr=[],compArr=[],aluArr=[],custoCompraArr=[],saldoArr=[],investBuyArr=[],investRentArr=[],equityArr=[],valImArr=[],despArr=[];
  var breakevenM=null;
  var minRendaCompra=0;

  for(var m=0;m<N;m++){
    if(m>0 && m%12===0){
      aluguel*=(1+s.inflacaoAA);   // reajuste do aluguel = inflação
      condo*=(1+s.inflacaoAA);
    }
    valImovelAtual*=(1+valoriz_m);
    var iptuM=valImovelAtual*s.iptuAnualPct/12;
    var renda=rendaMensal(s,m);
    var despesa=renda*(stageAt(s,s.idade+m/12).st.despesaPct||0);  // despesas ex-moradia = % da renda líquida
    var parc=(m<s.prazo)?sched.parc[m]:0;
    var saldo=(m<s.prazo)?sched.saldo[m]:0;
    var custoCompra=parc+condo+iptuM;
    if(m<s.prazo && parc>minRendaCompra) minRendaCompra=parc;
    var netBuy=renda-despesa-custoCompra;
    var netRent=renda-despesa-aluguel;

    investBuy=investBuy*(1+r_m)+netBuy; basisBuy+=netBuy;
    investRent=investRent*(1+r_m)+netRent; basisRent+=netRent;

    var equity=valImovelAtual*(1-s.corretagemPct)-saldo;
    var netInvBuy = investBuy - (investBuy>basisBuy?(investBuy-basisBuy)*aliq:0);
    var netInvRent= investRent- (investRent>basisRent?(investRent-basisRent)*aliq:0);
    var patBuy=netInvBuy+equity;
    var patRent=netInvRent;

    wBuy.push(patBuy);wRent.push(patRent);
    parcArr.push(parc);rendaArr.push(renda);aluArr.push(aluguel);
    custoCompraArr.push(custoCompra);saldoArr.push(saldo);despArr.push(despesa);
    investBuyArr.push(netInvBuy);investRentArr.push(netInvRent);equityArr.push(equity);valImArr.push(valImovelAtual);
    compArr.push(renda>0?custoCompra/renda:0);
    if(breakevenM==null && patBuy>=patRent && m>0) breakevenM=m;
  }

  res.i_m=i_m; res.taxaAA=instr.taxaini; res.P=P;
  res.entradaCash=entradaCash; res.custosAq=custosAq; res.valFin0=valFin0;
  res.primPrest=sched.parc[0]; res.ultPrest=sched.parc[s.prazo-1]; res.maiorPrest=minRendaCompra;
  res.rendaExigida=minRendaCompra/instr.compr;
  res.sched=sched;
  res.wBuy=wBuy; res.wRent=wRent; res.parc=parcArr; res.renda=rendaArr; res.alu=aluArr;
  res.custoCompra=custoCompraArr; res.saldo=saldoArr; res.investBuy=investBuyArr; res.investRent=investRentArr;
  res.equity=equityArr; res.valIm=valImArr; res.comprometimento=compArr; res.despesa=despArr;
  res.finalBuy=wBuy[N-1]; res.finalRent=wRent[N-1]; res.delta=wBuy[N-1]-wRent[N-1];
  res.breakevenAno=breakevenM==null?null:Math.ceil(breakevenM/12);
  res.aliqIR=aliq; res.investInicialBuy=s.patrimonioInicial-entradaCash-custosAq;
  res.N=N;
  return res;
}

/* ============================================================

function fmtAxis(v){ var a=Math.abs(v); if(a>=1e6)return (v/1e6).toFixed(1).replace('.',',')+"M"; if(a>=1e3)return Math.round(v/1e3)+"k"; return Math.round(v); }
function lineChart(series, nYears, breakeven){
  var W=760,H=320,pad={l:56,r:16,t:14,b:26};
  var pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  var all=[]; series.forEach(function(s){ all=all.concat(s.data); });
  var max=Math.max.apply(null,all), min=Math.min.apply(null,all,0);
  if(min>0)min=0; var rng=(max-min)||1;
  var n=series[0].data.length;
  function X(i){ return pad.l + pw*(i/(n-1)); }
  function Y(v){ return pad.t + ph*(1-(v-min)/rng); }
  var g='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  // gridlines
  for(var k=0;k<=4;k++){ var vy=min+rng*k/4, yy=Y(vy);
    g+='<line x1="'+pad.l+'" y1="'+yy+'" x2="'+(W-pad.r)+'" y2="'+yy+'" stroke="#E2E7EE"/>';
    g+='<text x="'+(pad.l-6)+'" y="'+(yy+3)+'" text-anchor="end" font-size="10" fill="#8290A0">'+fmtAxis(vy)+'</text>';
  }
  // x labels (years)
  var step=Math.ceil(nYears/8);
  for(var y=0;y<=nYears;y+=step){ var xi=Math.min(n-1,y*12); var xx=X(xi);
    g+='<text x="'+xx+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#8290A0">'+y+'</text>'; }
  // zero line
  if(min<0){ var zy=Y(0); g+='<line x1="'+pad.l+'" y1="'+zy+'" x2="'+(W-pad.r)+'" y2="'+zy+'" stroke="#B9C3CF"/>'; }
  // breakeven marker
  if(breakeven){ var bx=X(Math.min(n-1,breakeven*12)); g+='<line x1="'+bx+'" y1="'+pad.t+'" x2="'+bx+'" y2="'+(pad.t+ph)+'" stroke="#C55A17" stroke-dasharray="4 3"/>';
    g+='<text x="'+bx+'" y="'+(pad.t+10)+'" text-anchor="middle" font-size="9.5" fill="#C55A17" font-weight="700">breakeven ano '+breakeven+'</text>'; }
  series.forEach(function(s){
    var d=''; for(var i=0;i<n;i++){ d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(s.data[i]).toFixed(1)+' '; }
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.4"/>';
  });
  g+='</svg>';
  return g;
}
function barsCompare(compra, aluguel, nYears){
  // annual averages
  var W=760,H=250,pad={l:52,r:12,t:12,b:26};
  var pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  var yc=[],ya=[]; for(var y=0;y<nYears;y++){ var sc=0,sa=0,c=0; for(var m=y*12;m<(y+1)*12 && m<compra.length;m++){sc+=compra[m];sa+=aluguel[m];c++;} yc.push(sc/c);ya.push(sa/c); }
  var max=Math.max(Math.max.apply(null,yc),Math.max.apply(null,ya))||1;
  var g='<svg viewBox="0 0 '+W+' '+H+'">';
  for(var k=0;k<=4;k++){ var vy=max*k/4, yy=pad.t+ph*(1-k/4);
    g+='<line x1="'+pad.l+'" y1="'+yy+'" x2="'+(W-pad.r)+'" y2="'+yy+'" stroke="#E2E7EE"/>';
    g+='<text x="'+(pad.l-6)+'" y="'+(yy+3)+'" text-anchor="end" font-size="10" fill="#8290A0">'+fmtAxis(vy)+'</text>'; }
  var bw=pw/nYears, bar=Math.min(bw*0.38,16);
  var step=Math.ceil(nYears/12);
  for(var y=0;y<nYears;y++){ var cx=pad.l+bw*y+bw/2;
    var hc=ph*(yc[y]/max), ha=ph*(ya[y]/max);
    g+='<rect x="'+(cx-bar-1)+'" y="'+(pad.t+ph-hc)+'" width="'+bar+'" height="'+hc+'" fill="#3D4A5C"/>';
    g+='<rect x="'+(cx+1)+'" y="'+(pad.t+ph-ha)+'" width="'+bar+'" height="'+ha+'" fill="#7FC6A2"/>';
    if(y%step===0) g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#8290A0">'+y+'</text>';
  }
  g+='</svg>'; return g;
}
function tornado(items){
  var W=760, rowH=34, H=items.length*rowH+30, pad={l:200,r:16,t:8};
  var maxAbs=1; items.forEach(function(it){ maxAbs=Math.max(maxAbs,Math.abs(it.lo),Math.abs(it.hi)); });
  var cx=pad.l+(W-pad.l-pad.r)/2, half=(W-pad.l-pad.r)/2;
  var g='<svg viewBox="0 0 '+W+' '+H+'">';
  g+='<line x1="'+cx+'" y1="'+pad.t+'" x2="'+cx+'" y2="'+(H-22)+'" stroke="#B9C3CF"/>';
  items.forEach(function(it,idx){
    var y=pad.t+idx*rowH+4, mid=y+rowH/2-4;
    var xLo=cx+half*(it.lo/maxAbs), xHi=cx+half*(it.hi/maxAbs);
    var x1=Math.min(cx,xLo,xHi), x2=Math.max(cx,xLo,xHi);
    g+='<text x="'+(pad.l-10)+'" y="'+(mid+3)+'" text-anchor="end" font-size="11" fill="#42505F">'+it.label+'</text>';
    g+='<rect x="'+Math.min(cx,xLo)+'" y="'+(mid-9)+'" width="'+Math.abs(xLo-cx)+'" height="18" fill="#E23A2E" opacity="0.75"/>';
    g+='<rect x="'+Math.min(cx,xHi)+'" y="'+(mid-9)+'" width="'+Math.abs(xHi-cx)+'" height="18" fill="#2E7D4F" opacity="0.8"/>';
  });
  g+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="#8290A0">← favorece alugar    |    favorece comprar →</text>';
  g+='</svg>'; return g;
}

  h+='<div class="card"><h2>Evolução ano a ano — cenário Aluguel</h2><div class="mtwrap"><table class="mtbl"><thead><tr>'+
     '<th>Ano</th><th>Aluguel/mês</th><th>Custo compra/mês</th><th>Diferença/mês</th><th>Investido líq. (Aluguel)</th><th>Investido líq. (Compra)</th></tr></thead><tbody>';
  for(var y=1;y<=R.anos;y++){ var m=Math.min(R.N-1,y*12-1); var dif=R.custoCompra[m]-R.alu[m];
    h+='<tr><td>'+y+'</td><td>'+brl(R.alu[m])+'</td><td>'+brl(R.custoCompra[m])+'</td><td class="'+(dif>=0?'pos':'neg')+'">'+(dif>=0?'+':'−')+brl(Math.abs(dif))+'</td><td><b>'+brl(R.investRent[m])+'</b></td><td>'+brl(R.investBuy[m])+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  $('p-aluguel').innerHTML=h;
}

function renderCarreira(R){
  var h='';
  h+='<div class="card"><h2>Escada de carreira</h2><p class="cap">Cada nível tem seu salário bruto de entrada e um crescimento anual próprio. O 1º nível começa na idade do proponente ('+S.idade+' anos); o último vai até os '+FIM_IDADE+'. CLT recebe 13º + férias (1 salário extra cada); PJ/sócio, não. O bônus é em número de salários por ano. As despesas (fora moradia) são um % da renda líquida do nível.</p>';
  h+='<table class="careertbl"><thead><tr><th>Nível</th><th>Até a idade</th><th>Salário bruto (R$/mês)</th><th>Cresc. a.a.</th><th style="text-align:center">CLT</th><th>Bônus (nº sal.)</th><th>Despesas (% renda líq.)</th></tr></thead><tbody>';
  for(var i=0;i<S.stages.length;i++){ var st=S.stages[i]; var last=(i===S.stages.length-1);
    h+='<tr>'+
      '<td><input class="txt" value="'+st.nome+'" onchange="setStage('+i+',\'nome\',this.value)"></td>'+
      '<td>'+(last?('<span class="badge">'+FIM_IDADE+'</span>'):('<input value="'+st.ate+'" onchange="setStage('+i+',\'ate\',this.value)">'))+'</td>'+
      '<td><input value="'+num(st.comp)+'" onchange="setStage('+i+',\'comp\',this.value)"></td>'+
      '<td><input value="'+pct(st.cresc,1)+'" onchange="setStage('+i+',\'cresc\',this.value)"></td>'+
      '<td style="text-align:center"><input type="checkbox" '+(st.clt?'checked':'')+' onchange="setStageCLT('+i+',this.checked)"></td>'+
      '<td><input value="'+num(st.bonus||0,1)+'" onchange="setStage('+i+',\'bonus\',this.value)"></td>'+
      '<td><input value="'+pct(st.despesaPct||0,0)+'" onchange="setStage('+i+',\'despesaPct\',this.value)"></td>'+
      '</tr>';
  }
  h+='</tbody></table><p class="note">Salário: bruto − INSS − IRRF (tabelas mensais 2025, sem dependentes, escolhendo automaticamente o desconto simplificado ou completo); 13º e férias tributados pela tabela mensal. <b>Bônus/PLR</b>: isento de INSS e tributado pela <b>tabela exclusiva anual da PLR</b> (0% até R$8.214,40 … 27,5% acima de R$16.380,38). Despesas ex-moradia são um % da renda líquida por nível (coluna acima).</p></div>';
  // net salary breakdown for the entry salary of each level (today)
  h+='<div class="card"><h2>Remuneração líquida por nível (hoje)</h2><div class="mtwrap"><table class="mtbl"><thead><tr><th>Nível</th><th>Bruto/mês</th><th>INSS</th><th>IRRF mês</th><th>Líquido/mês</th><th>Bônus bruto/ano</th><th>Bônus líq./ano (PLR)</th><th>Renda líq. média/mês</th></tr></thead><tbody>';
  for(var i=0;i<S.stages.length;i++){ var st=S.stages[i]; var G=st.comp; var inss=inssCalc(G); var baseC=G-inss,baseS=G-564.80; var irrf=Math.min(irrfTabela(baseC),irrfTabela(baseS)); var c=compNet(G,st.clt,st.bonus);
    h+='<tr><td>'+st.nome+'</td><td>'+brl(G)+'</td><td class="neg">'+brl(inss)+'</td><td class="neg">'+brl(irrf)+'</td><td>'+brl(c.liqMes)+'</td><td>'+brl(c.bonusBruto)+'</td><td>'+brl(c.bonusLiq)+'</td><td><b>'+brl(c.media)+'</b></td></tr>'; }
  h+='</tbody></table></div><p class="note">Renda líq. média/mês = [ líquido mensal × (12 + 13º/férias se CLT) + bônus líquido anual (PLR) ] ÷ 12 — é o valor usado no fluxo de caixa. Não inclui o crescimento anual dentro do nível.</p></div>';
  // renda vs moradia chart
  h+='<div class="card"><h2>Renda líquida vs. custo da moradia (compra)</h2><p class="cap">Média anual. Mostra o esforço da parcela ao longo da carreira.</p>';
  h+='<div class="legend"><span><i style="background:#2C6E9B"></i>Renda líq. mensal</span><span><i style="background:#3D4A5C"></i>Custo moradia (compra)</span></div>';
  h+=barsCompareRenda(R.renda,R.custoCompra,R.anos);
  h+='<p class="note">Comprometimento no 1º ano: <b>'+pct(R.comprometimento[11]||R.comprometimento[0],0)+'</b> · no último ano: <b>'+pct(R.comprometimento[R.N-1],0)+'</b>.</p></div>';
  // yearly income table
  h+='<div class="card"><h2>Renda e poupança ano a ano</h2><div class="mtwrap"><table class="mtbl"><thead><tr><th>Ano</th><th>Idade</th><th>Renda líq./mês</th><th>Despesas/mês</th><th>Sobra p/ moradia+invest.</th></tr></thead><tbody>';
  for(var y=1;y<=R.anos;y++){ var m=Math.min(R.N-1,y*12-1); var desp=R.despesa[m];
    var sobra=R.renda[m]-desp;
    h+='<tr><td>'+y+'</td><td>'+(S.idade+y-1)+'</td><td>'+brl(R.renda[m])+'</td><td>'+brl(desp)+'</td><td class="'+(sobra>=0?'pos':'neg')+'">'+brl(sobra)+'</td></tr>'; }
  h+='</tbody></table></div></div>';
  $('p-carreira').innerHTML=h;
}
function barsCompareRenda(renda,custo,nYears){
  var W=760,H=250,pad={l:52,r:12,t:12,b:26};var pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  var yr=[],yc=[];for(var y=0;y<nYears;y++){var sr=0,sc=0,c=0;for(var m=y*12;m<(y+1)*12&&m<renda.length;m++){sr+=renda[m];sc+=custo[m];c++;}yr.push(sr/c);yc.push(sc/c);}
  var max=Math.max.apply(null,yr)||1;
  var g='<svg viewBox="0 0 '+W+' '+H+'">';
  for(var k=0;k<=4;k++){var vy=max*k/4,yy=pad.t+ph*(1-k/4);g+='<line x1="'+pad.l+'" y1="'+yy+'" x2="'+(W-pad.r)+'" y2="'+yy+'" stroke="#E2E7EE"/><text x="'+(pad.l-6)+'" y="'+(yy+3)+'" text-anchor="end" font-size="10" fill="#8290A0">'+fmtAxis(vy)+'</text>';}
  var bw=pw/nYears,bar=Math.min(bw*0.38,16),step=Math.ceil(nYears/12);
  for(var y=0;y<nYears;y++){var cx=pad.l+bw*y+bw/2;var hr=ph*(yr[y]/max),hc=ph*(yc[y]/max);
    g+='<rect x="'+(cx-bar-1)+'" y="'+(pad.t+ph-hr)+'" width="'+bar+'" height="'+hr+'" fill="#2C6E9B"/>';
    g+='<rect x="'+(cx+1)+'" y="'+(pad.t+ph-hc)+'" width="'+bar+'" height="'+hc+'" fill="#3D4A5C"/>';
    if(y%step===0)g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#8290A0">'+y+'</text>';}
  g+='</svg>';return g;
}
function setStage(i,f,v){ if(f==='nome')S.stages[i].nome=v; else if(f==='ate')S.stages[i].ate=parseNum(v); else if(f==='comp')S.stages[i].comp=parseNum(v); else if(f==='cresc')S.stages[i].cresc=parseNum(v)/100; else if(f==='bonus')S.stages[i].bonus=parseNum(v); else if(f==='despesaPct')S.stages[i].despesaPct=parseNum(v)/100; update(); }
function setStageCLT(i,v){ S.stages[i].clt=v; update(); }

function renderSens(){
  var base=compute(S).delta;
  var defs=[
    {label:'Rendimento do patrimônio', key:'rendimentoAA', d:0.02},
    {label:'Valorização real do imóvel', key:'valorizReal', d:0.02},
    {label:'Aluguel inicial', key:'aluguelMensal', d:0.2, mult:true},
    {label:'Inflação', key:'inflacaoAA', d:0.02},
    {label:'Idade (horizonte)', key:'idade', d:5, abs:true, min:18, max:60},
    {label:'Prazo do financiamento', key:'prazo', d:60, abs:true, min:60, max:420}
  ];
  var items=defs.map(function(def){
    var lo=JSON.parse(JSON.stringify(S)), hi=JSON.parse(JSON.stringify(S));
    if(def.mult){ lo[def.key]=S[def.key]*(1-def.d); hi[def.key]=S[def.key]*(1+def.d); }
    else if(def.abs){ lo[def.key]=Math.max(def.min,S[def.key]-def.d); hi[def.key]=Math.min(def.max,S[def.key]+def.d); }
    else { lo[def.key]=S[def.key]-def.d; hi[def.key]=S[def.key]+def.d; }
    var dLo=compute(lo).delta-base, dHi=compute(hi).delta-base;
    return {label:def.label, lo:dLo, hi:dHi, span:Math.abs(dHi-dLo)};
  }).sort(function(a,b){return b.span-a.span;});
  var h='<div class="card"><h2>Sensibilidade da decisão</h2><p class="cap">Impacto na diferença de patrimônio (Comprar − Alugar) ao mover cada premissa. Barras à direita (verde) favorecem comprar; à esquerda (vermelho), alugar. Base atual: '+ (base>=0?'+':'−')+brlK(Math.abs(base))+'.</p>';
  h+=tornado(items);
  h+='<p class="note">Cada barra varia uma premissa por vez: taxas ±2 p.p., aluguel ±20%, prazo ±60 meses, mantendo o resto constante.</p></div>';
  // scenario table
  h+='<div class="card"><h2>Cenários</h2><div class="mtwrap"><table class="mtbl"><thead><tr><th>Cenário</th><th>Valoriz. real</th><th>Rendimento</th><th>Inflação</th><th>Patrim. Comprar</th><th>Patrim. Alugar</th><th>Diferença</th><th>Breakeven</th></tr></thead><tbody>';
  var scen=[
    {n:'Pessimista p/ compra', vz:S.valorizReal-0.02, rd:S.rendimentoAA+0.02, inf:S.inflacaoAA},
    {n:'Base', vz:S.valorizReal, rd:S.rendimentoAA, inf:S.inflacaoAA},
    {n:'Otimista p/ compra', vz:S.valorizReal+0.02, rd:S.rendimentoAA-0.02, inf:S.inflacaoAA}
  ];
  scen.forEach(function(sc){ var ss=JSON.parse(JSON.stringify(S)); ss.valorizReal=sc.vz;ss.rendimentoAA=sc.rd;ss.inflacaoAA=sc.inf; var r=compute(ss);
    h+='<tr><td>'+sc.n+'</td><td>'+pct(sc.vz,1)+'</td><td>'+pct(sc.rd,1)+'</td><td>'+pct(sc.inf,1)+'</td><td>'+brlK(r.finalBuy)+'</td><td>'+brlK(r.finalRent)+'</td><td class="'+(r.delta>=0?'pos':'neg')+'">'+(r.delta>=0?'+':'−')+brlK(Math.abs(r.delta))+'</td><td>'+(r.breakevenAno?('Ano '+r.breakevenAno):'—')+'</td></tr>'; });
  h+='</tbody></table></div></div>';
  $('p-sens').innerHTML=h;
}

/* ============================================================
   UPDATE / TABS / RESET
   ============================================================ */
var curTab='veredito';
function showTab(t,btn){ curTab=t; ['veredito','compra','aluguel','carreira','sens'].forEach(function(x){ $('p-'+x).classList.toggle('on',x===t); }); if(btn){ document.querySelectorAll('#tabs button').forEach(function(b){b.classList.remove('on');}); btn.classList.add('on'); } update(); }
function update(){
  syncInstrumento();
  // refresh instrument dropdown options (eligibility changes with sliders)
  var sel=$('selInstr'); if(sel){ var elig=elegiveis(S); var o=''; elig.forEach(function(x){ o+='<option value="'+x.cod+'"'+(x.cod===S.cod?' selected':'')+'>'+x.agfi+' — '+pct(x.taxaini,2)+' · '+x.sistema+'</option>'; }); if(!elig.length)o='<option>Nenhuma linha elegível p/ esta combinação</option>'; sel.innerHTML=o; }
  // refresh instrument dropdown selection & info without rebuilding all sliders
  var R=compute(S);
  var hz=$('horizInfo'); if(hz){ hz.innerHTML='Horizonte fixo até os '+FIM_IDADE+' anos → <b>'+horizAnos(S)+' anos</b> de análise.'; }
  var info=$('instrInfo'); if(info){ if(R.empty) info.innerHTML='<span class="warn">Nenhuma linha elegível.</span>'; else info.innerHTML=R.instr.nome+'<br>Faixa de valor: '+brl(R.instr.valmin)+(R.instr.valmax?(' a '+brl(R.instr.valmax)):' ou mais')+' · % máx.: '+pct(parseFloat(R.instr.percfinmax),0)+' · prazo '+R.instr.prmin+'–'+R.instr.prmax+' m'+(R.instr.fgts?' · aceita FGTS':' · sem FGTS'); }
  if(curTab==='veredito')renderVeredito(R);
  else if(curTab==='compra')renderCompra(R);
  else if(curTab==='aluguel')renderAluguel(R);
  else if(curTab==='carreira')renderCarreira(R);
  else if(curTab==='sens')renderSens();
}
function resetAll(){ S=JSON.parse(JSON.stringify(BASE)); buildPrem(); update(); }

buildPrem();
update();
